# ci.yml
# Put this file at:  .github/workflows/ci.yml   (create the folders if they don't exist)
#
# What it does on every push to a team branch and every pull request into main:
#   Gate 1  - the solution builds with no errors
#   Gate 2  - every MSTest suite passes (P3.Core.Tests and P2.LoadGenerator.Tests)
#   Gate 3  - smoke test: P2 runs once, writes SampleData/runs.json, and that
#             file contains a run P3 can read (BuildId + EndpointMetrics)
#
# Notes
#   * windows-latest is used so StoreSim's WinForms project can be added to the
#     build later without changing the runner. P2 and P3 build fine on it.
#   * Both .NET 8 (the projects) and .NET 10 (the test project) are installed.
#   * Plain `dotnet test` output (the Actions log) is the evidence. If you later
#     add the TRX report package, add `--report-trx` to the test steps.
#   * The smoke step edits SampleData/runs.json inside the CI workspace only;
#     nothing is committed back.

name: CI

on:
  push:
    branches: [ main, skDev, DevQm, abDev ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore P3RegressionTracking.slnx

      - name: Build (gate 1)
        run: dotnet build P3RegressionTracking.slnx --configuration Release --no-restore

      - name: P3 unit tests (gate 2)
        run: dotnet test P3.Core.Tests/P3.Core.Tests.csproj --configuration Release --no-build

      - name: P2 unit tests (gate 2)
        run: dotnet test P2.LoadGenerator.Tests/P2.LoadGenerator.Tests.csproj --configuration Release

      - name: Smoke test - P2 export is readable by P3 (gate 3)
        shell: pwsh
        env:
          BUILD_ID: ci-${{ github.run_number }}
        run: |
          $path = "SampleData/runs.json"
          $before = @(Get-Content $path -Raw | ConvertFrom-Json).Count

          dotnet run --project P2.LoadGenerator --configuration Release --no-build
          if ($LASTEXITCODE -ne 0) { Write-Error "P2 load generator failed"; exit 1 }

          $runs = @(Get-Content $path -Raw | ConvertFrom-Json)
          if ($runs.Count -ne ($before + 1)) {
            Write-Error "Expected exactly one new run in runs.json, found $($runs.Count - $before)"
            exit 1
          }

          $last = $runs[-1]
          if (-not $last.BuildId -or @($last.EndpointMetrics).Count -lt 1) {
            Write-Error "Exported run is missing BuildId or EndpointMetrics"
            exit 1
          }

          Write-Host "Smoke test passed: build $($last.BuildId) with $(@($last.EndpointMetrics).Count) endpoint(s)"
